# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: tmykkanen/astro-church-rebuild

media_folder: /src/assets
# public_folder: /media

output:
  omit_empty_optional_fields: true

singletons:
  - name: site
    label: Site
    file: src/content/config/site.yaml
    media_folder: "{{media_folder}}/site"
    icon: settings
    fields:
      - name: churchName
        label: Church Name
        widget: object
        fields:
          - name: name
            label: Name
            widget: string
          - name: showInHeader
            label: Show In Header
            widget: boolean
            default: true
      - name: churchDescription
        label: Church Description
        widget: text
      - name: churchLogo
        label: Church Logo
        widget: object
        required: false
        fields:
          - name: image
            label: Logo Image
            widget: image
          - name: showInHeader
            label: Show In Header
            widget: boolean
            default: true
      - name: favicon
        label: Favicon
        widget: image
        media_folder: "/public"
        public_folder: "/"
        accept: "image/svg"
        required: false
      - name: icon
        label: Icon
        widget: image
        media_folder: "/public"
        public_folder: "/"
        accept: "image/ico"
        required: false
      - name: socials
        label: Social Media
        widget: list
        required: false
        fields:
          - name: name
            label: Name
            widget: string
          - name: icon
            label: Icon
            widget: string
            hint: Use identifier from https://simpleicons.org/
          - name: link
            label: Link
            widget: string
            type: url
          - name: tooltip
            label: Tooltip
            widget: string
            required: false
          - name: showInFooter
            label: Show In Footer
            widget: boolean
            default: true
  - name: theme
    label: Theme
    file: src/content/config/theme.yaml
    media_folder: "{{media_folder}}/site"
    icon: settings
    fields:
      - name: customCss
        label: Custom Css
        widget: code
        default_language: css
        required: false
  - name: navigation
    label: Navigation
    file: src/content/config/navigation.yaml
    icon: settings
    fields:
      - name: navigationEntries
        label: Navigation Entries
        label_singular: Navigation Entry
        widget: list
        typeKey: navigationEntryType
        types:
          - &type_page
            name: page
            label: Page
            fields:
              - &navigation_label
                name: label
                label: Label
                widget: string
              - name: page
                label: Page
                widget: relation
                collection: pages
          - &type_feature
            name: feature
            label: Feature
            fields:
              - *navigation_label
              - name: featureType
                label: Type
                widget: select
                options:
                  - { label: Sermon, value: "sermons" }
                  - { label: Blog, value: "blog" }
                  - { label: Calendar, value: "calendar" }
                  - { label: Team, value: "team" }
              - name: customSlug
                label: Custom URL Slug
                comment: Custom URL will be slugified. Leave blank for default URL.
                widget: string
                required: false
          - &type_external
            name: external
            label: External Link
            fields:
              - *navigation_label
              - name: url
                label: URL
                widget: string
                type: url
          - name: group
            label: Group
            fields:
              - *navigation_label
              - name: children
                label: Children
                widget: list
                typeKey: navigationEntryType
                types:
                  - *type_page
                  - *type_feature
                  - *type_external
  - name: homepage
    label: Homepage
    file: src/content/config/homepage.yaml
    media_folder: "{{media_folder}}/site"
    icon: settings
    fields:
      - name: hero
        label: Hero Settings
        widget: object
        required: false
        fields:
          - name: text
            label: Hero Text
            widget: code
            default_language: html
          - name: bgImage
            label: Background Image
            widget: image
            required: false
      - name: cta
        label: Call to Action Settings
        widget: object
        required: false
        fields:
          - name: text
            label: CTA Text
            widget: code
            default_language: html
          - name: link
            label: CTA Link
            widget: string
            type: url
            required: false
  - name: footer
    label: Footer
    file: src/content/config/footer.yaml
    media_folder: "{{media_folder}}/site"
    icon: settings
    fields:
      - name: sections
        label: Sections
        widget: list
        required: false
        fields:
          - &heading
            name: heading
            label: Heading
            widget: string
          # TODO: Markdown or code?
          - &content
            name: content
            label: Content
            widget: markdown
      # TODO: Add form resend config
      - name: subscribe
        label: Subscribe Form
        widget: object
        required: false
        fields:
          - &isActive
            name: isActive
            label: Activate Form
            widget: boolean
            default: true
          - *heading
          - *content
      - name: giving
        label: Giving
        widget: object
        required: false
        fields:
          - <<: *isActive
            label: Activate Giving
          - *heading
          - *content
          - name: link
            label: Link
            widget: string
            type: url
  - name: team
    label: Team
    file: src/content/config/team.yaml
    icon: settings
    fields:
      - name: pageTitle
        label: Page Title
        widget: string
      - name: pageDescription
        label: Page Description
        widget: markdown
      - name: sections
        label: Sections
        widget: list
        required: false
        fields:
          - name: name
            label: Name
            widget: string
          - name: description
            label: Description
            widget: markdown
            required: false
          - name: entries
            label: Entries
            widget: list
            field:
              name: person
              label: Person
              widget: relation
              collection: people
              display_fields: [fullName]
              search_fields: [fullName]
  - name: blog
    label: Blog
    file: src/content/config/blog.yaml
    icon: settings
    fields:
      - name: tags
        label: Tags
        widget: list
        min: 1
        field:
          name: tag
          label: Tag
          widget: string
