collections:
  - name: people
    label: People
    icon: person
    folder: src/content/people
    media_folder: "{{media_folder}}/people"
    slug: "{{fields.fullName}}"
    summary: "{{fullName}}"
    fields:
      - name: firstName
        label: First Name
        widget: string
      - name: lastName
        label: Last Name
        widget: string
      - name: fullName
        label: Full Name
        widget: compute
        value: "{{fields.firstName}} {{fields.lastName}}"
      - name: image
        label: Upload a Picture
        widget: image
        required: false
      - name: position
        label: Position
        widget: string
        required: false
      - name: email
        label: Email
        widget: string
        type: email
        required: false
      - name: isGuest
        label: Guest Preacher
        widget: boolean
        default: false
        required: false
      - name: sortPriority
        label: Sort Priority
        widget: number
        default: 0
        required: false
      - name: body
        label: Bio
        widget: markdown
        required: false
  - divider: true
